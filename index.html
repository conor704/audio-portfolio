<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Conor's interactive sound-design portfolio.">
  <title>Conor — Sound Design</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="identity" href="#portfolio" aria-label="Conor sound-design portfolio">
      <span class="identity__name">CONOR</span>
      <span class="identity__role">SOUND DESIGN</span>
    </a>

    <button id="soundToggle" class="sound-toggle" type="button" aria-pressed="false">
      <span class="sound-toggle__dot" aria-hidden="true"></span>
      <span id="soundToggleLabel">Enable sound</span>
    </button>
  </header>

  <main id="portfolio" class="portfolio">
    <section id="stage" class="stage" aria-label="Interactive orbiting sound portfolio" aria-describedby="instructions">
      <svg id="orbitMap" class="orbit-map" aria-hidden="true">
        <ellipse data-orbit="horizontal"></ellipse>
        <ellipse data-orbit="vertical"></ellipse>
        <ellipse data-orbit="diagonal-down"></ellipse>
        <ellipse data-orbit="diagonal-up"></ellipse>
      </svg>

      <div class="portrait" aria-hidden="true">
        <img class="portrait__svg" src="assets/img/conor-head-outline.png" alt="">
      </div>

      <div id="soundPlanets" class="sound-planets" aria-label="Sound pieces"></div>

      <aside id="soundCard" class="sound-card" aria-live="polite" aria-hidden="true">
        <p id="soundCardEyebrow" class="sound-card__eyebrow">SOUND STUDY</p>
        <h2 id="soundCardTitle" class="sound-card__title"></h2>
        <p id="soundCardDescription" class="sound-card__description"></p>
      </aside>
    </section>
  </main>

  <p id="instructions" class="instructions">
    <span id="desktopInstruction" class="instructions__desktop">Enable sound, then hover over an icon</span>
    <span id="touchInstruction" class="instructions__touch">Tap an icon to stop and listen</span>
  </p>

  <div id="screenReaderStatus" class="sr-only" aria-live="polite"></div>

  <svg class="icon-library" width="0" height="0" aria-hidden="true">
    <symbol id="icon-wave" viewBox="0 0 32 32">
      <path d="M3 16h4l2-8 4 16 4-21 4 26 4-13h4"/>
    </symbol>

    <symbol id="icon-impact" viewBox="0 0 32 32">
      <path d="M16 2v9M16 21v9M2 16h9M21 16h9M6 6l6 6M20 20l6 6M26 6l-6 6M12 20l-6 6"/>
      <circle cx="16" cy="16" r="3.5"/>
    </symbol>

    <symbol id="icon-bars" viewBox="0 0 32 32">
      <path d="M5 21v-10M10 26V6M15 22V10M20 28V4M25 24V8M30 19v-6"/>
    </symbol>

    <symbol id="icon-rings" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="4"/>
      <circle cx="16" cy="16" r="9"/>
      <circle cx="16" cy="16" r="14"/>
    </symbol>

    <symbol id="icon-particles" viewBox="0 0 32 32">
      <circle cx="8" cy="9" r="2"/>
      <circle cx="18" cy="7" r="1.4"/>
      <circle cx="25" cy="14" r="2.2"/>
      <circle cx="11" cy="21" r="2.5"/>
      <circle cx="23" cy="25" r="1.7"/>
    </symbol>
  </svg>

  <script src="assets/js/main.js"></script>
</body>
</html>
